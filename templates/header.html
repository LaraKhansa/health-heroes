<!-- Unified Header Component for Health Heroes -->
<header class="unified-header">
    <div class="header-content">
        <!-- Left Section: Welcome & App Title (Home Link) -->
        <div class="header-left">
            <p class="welcome-text" id="welcomeText">{{ 'مرحباً' if language == 'ar' else 'Welcome' }}, {{ user_name }}</p>
            <a href="{{ url_for('home_page') }}?lang={{ language }}" class="app-title-link">
                <h2 class="app-title">Afiyah ⭐</h2>
            </a>
        </div>
        
        <!-- Right Section: Logout Button -->
        <div class="header-right">
            <a href="{{ url_for('profile.view_profile') }}" class="logout-btn" id="profileBtn">👤 {{ 'الملف' if language == 'ar' else 'Profile' }}</a>
            <a href="{{ url_for('auth.logout') }}" class="logout-btn" id="logoutBtn">{{ 'تسجيل الخروج' if language == 'ar' else 'Logout' }} ⬆</a>
        </div>
    </div>
</header>
